name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          # GCC 11 and glibc 2.35, older than ubuntu-latest's, build the C. The
          # sanitizers' steps skip there: ubuntu-latest's run checks the same C.
          - ubuntu-22.04
          - macos-latest
          - windows-2025

    runs-on: ${{ matrix.os }}
    # A run takes about an hour; this ends a hang before GitHub's six hours.
    timeout-minutes: 120

    # On Windows, which has no fork, windtrap runs a suite's tests in its own
    # process, so a test that crashes it ends the suite with no report. There
    # a suite prints a line as each test ends: the crashed test is the one
    # after the last line, in the order its --list prints.
    env:
      WINDTRAP_VERBOSE: ${{ startsWith(matrix.os, 'windows') && '1' || '0' }}

    defaults:
      run:
        shell: bash

    steps:
      # The doc and expect tests compare byte-for-byte; a CRLF checkout on
      # Windows would diff every line.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      # Strawberry Perl ships a pkg-config shim that shadows Cygwin's pkgconf
      # and breaks the bytesrw build.
      - name: Drop Strawberry Perl's pkg-config shim
        if: runner.os == 'Windows'
        run: rm -f "C:/Strawberry/perl/bin/pkg-config" "C:/Strawberry/perl/bin/pkg-config.bat"

      # opam installs bytesrw's pkgconf through Cygwin's setup, which also
      # upgrades a cached Cygwin and kills every process holding cygwin1.dll:
      # run from the Cygwin bash of the other steps, it kills its own step.
      - name: Install pkgconf outside Cygwin
        if: runner.os == 'Windows'
        shell: pwsh
        run: opam install conf-pkg-config

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-test
          # The root's opam files hold every dependency of the contrib
          # packages but jord.safe's xmlm.
          opam install xmlm

      # Each package's steps run when an earlier package's failed, so one run
      # shows every package's failures.
      #
      # Every runtest runs under .github/memcap.sh, which caps its memory so
      # that a test that leaks is killed before the runner runs out.
      - name: Build and test lz
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/lz
          bash .github/memcap.sh opam exec -- dune build --release @packages/lz/runtest

      # lz's decoders parse untrusted bytes: their suites run with the C built
      # under AddressSanitizer and UndefinedBehaviorSanitizer, each property
      # over 1000 inputs. The suites run one at a time: a law on two domains
      # needs a processor for each domain and the test's, and beside another
      # suite on a 3-core runner every stop-the-world collection of the
      # stressed collector waits for a domain the scheduler took off.
      #
      # The steps under the sanitizers build in their own directory. A
      # library built there links AddressSanitizer's runtime, which a plain
      # process cannot load, and a later step that installs the package
      # without rebuilding it, such as quill's preload, would load it.
      - name: Test lz under the sanitizers
        if: ${{ !cancelled() && runner.os != 'Windows' && matrix.os != 'ubuntu-22.04' }}
        env:
          DUNE_BUILD_DIR: _build_sanitize
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:use_sigaltstack=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          WINDTRAP_PROP_COUNT: 1000
        run: |
          opam exec -- dune build --profile sanitize @packages/lz/all
          bash .github/memcap.sh opam exec -- dune build --profile sanitize -j 1 @packages/lz/runtest

      # rig's GPU suites skip on runners without the GPU they drive.
      - name: Build and test rig
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/rig
          bash .github/memcap.sh opam exec -- dune build --release @packages/rig/runtest

      - name: Build and test nx
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/nx
          bash .github/memcap.sh opam exec -- dune build --release @packages/nx/runtest

      # Every nx suite runs with the C of nx built under AddressSanitizer and
      # UndefinedBehaviorSanitizer. The codecs parse untrusted bytes, and the
      # array layer reads and writes views at any bit: their properties run
      # first, over 1000 cases each. A domain's thread exits on the signal
      # stack the OCaml runtime allocated, which AddressSanitizer would unmap
      # as its own. The documentation's examples run in the step above: the
      # mdx stanzas are off under the sanitizers.
      - name: Test nx under the sanitizers
        if: ${{ !cancelled() && runner.os != 'Windows' && matrix.os != 'ubuntu-22.04' }}
        env:
          DUNE_BUILD_DIR: _build_sanitize
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:use_sigaltstack=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          WINDTRAP_PROP_COUNT=1000 bash .github/memcap.sh opam exec -- dune build --profile sanitize @packages/nx/test/io/runtest
          WINDTRAP_PROP_COUNT=1000 bash .github/memcap.sh opam exec -- dune build --profile sanitize @packages/nx/test/array/runtest
          bash .github/memcap.sh opam exec -- dune build --profile sanitize @packages/nx/test/runtest

      - name: Build and test brot
        if: ${{ !cancelled() }}
        env:
          BROT_REQUIRE_FIXTURES: 1
        run: |
          packages/brot/bench/download_data.sh
          opam exec -- dune build --release packages/brot
          bash .github/memcap.sh opam exec -- dune build --release @packages/brot/runtest

      - name: Build and test talon
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/talon
          bash .github/memcap.sh opam exec -- dune build --release @packages/talon/runtest

      # The CSV and Parquet decoders parse untrusted bytes: their suites, the
      # fuzz suites included, run with the C built under AddressSanitizer and
      # UndefinedBehaviorSanitizer, each property over 1000 files.
      - name: Test talon's decoders under the sanitizers
        if: ${{ !cancelled() && runner.os != 'Windows' && matrix.os != 'ubuntu-22.04' }}
        env:
          DUNE_BUILD_DIR: _build_sanitize
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          WINDTRAP_PROP_COUNT: 1000
        run: bash .github/memcap.sh opam exec -- dune build --profile sanitize @packages/talon/test/csv/runtest @packages/talon/test/parquet/runtest

      # Talon's benchmark questions at the CI size (H2O at 1e6 rows, the
      # decision-support queries at scale factor 0.1) must answer as DuckDB's committed answers do. The
      # suite's uv scripts generate the data; one OS suffices, since the
      # answers depend on talon's semantics, which runtest covers per OS.
      - name: Set-up uv
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: astral-sh/setup-uv@v6

      - name: Check talon's benchmark answers
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        env:
          DATA: ${{ runner.temp }}/talon-bench
        run: |
          (cd packages/talon/bench/queries && uv run h2o_data.py 1e6 "$DATA" && uv run decision_data.py 0.1 "$DATA")
          opam exec -- dune exec --release packages/talon/bench/queries/runner.exe -- check packages/talon/bench/queries/answers "$DATA"

      - name: Build and test rune
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/rune
          bash .github/memcap.sh opam exec -- dune build --release @packages/rune/runtest

      - name: Build and test ppx_ptree
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/ppx_ptree
          bash .github/memcap.sh opam exec -- dune build --release @packages/ppx_ptree/runtest

      - name: Build and test kaun
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/kaun
          bash .github/memcap.sh opam exec -- dune build --release @packages/kaun/runtest

      - name: Build and test apps
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release apps
          bash .github/memcap.sh opam exec -- dune build --release @apps/runtest

      - name: Build and test vega
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/vega
          bash .github/memcap.sh opam exec -- dune build --release @packages/vega/runtest

      - name: Build and test fehu
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release contrib/fehu
          bash .github/memcap.sh opam exec -- dune build --release @contrib/fehu/runtest

      - name: Build and test munin
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/munin
          bash .github/memcap.sh opam exec -- dune build --release @packages/munin/runtest

      - name: Build and test jera
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/jera
          bash .github/memcap.sh opam exec -- dune build --release @packages/jera/runtest

      - name: Build and test norn
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/norn
          bash .github/memcap.sh opam exec -- dune build --release @packages/norn/runtest

      - name: Build and test ymir
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release contrib/ymir
          bash .github/memcap.sh opam exec -- dune build --release @contrib/ymir/runtest

      - name: Build and test jord
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release contrib/jord
          bash .github/memcap.sh opam exec -- dune build --release @contrib/jord/runtest

      - name: Build and test alda
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release contrib/alda
          bash .github/memcap.sh opam exec -- dune build --release @contrib/alda/runtest

      - name: Build and test mynd
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release contrib/mynd
          bash .github/memcap.sh opam exec -- dune build --release @contrib/mynd/runtest

      - name: Build and test tolk
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/tolk
          bash .github/memcap.sh opam exec -- dune build --release @packages/tolk/runtest

      - name: Build and test hugin
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/hugin
          bash .github/memcap.sh opam exec -- dune build --release @packages/hugin/runtest

      - name: Build and test quill
        if: ${{ !cancelled() }}
        run: |
          opam exec -- dune build --release packages/quill
          bash .github/memcap.sh opam exec -- dune build --release @packages/quill/runtest

      # windtrap captures a test's output, so a sanitizer's report, written to
      # standard error as the process aborts, lands in the test's capture
      # under _tests in the build directory and in no failure block.
      - name: Print the sanitizers' reports
        if: failure() && runner.os != 'Windows'
        run: |
          { grep -rlsE 'Sanitizer|runtime error:' _build/_tests _build_sanitize/_tests || true; } |
            while read -r f; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done

  # Each released package built and tested alone from the release's sources,
  # as opam-repository's CI builds it, on the oldest OCaml it admits.
  packages:
    strategy:
      fail-fast: false
      matrix:
        # brot admits 5.2; munin and quill 5.4, through matrix; the others 5.5.
        ocaml-compiler:
          - '5.5'
          - '5.4'
          - '5.2'

    runs-on: ubuntu-latest
    timeout-minutes: 120

    # opam prints a failed build's whole log, test reports included.
    env:
      OPAMERRLOGLEN: 0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # The release's archive holds the committed files of HEAD. Pinned from
      # it, a package builds as `dune build -p <package> @install @runtest`
      # against the others installed, without the tree's other directories.
      - name: Pin the release's packages
        run: |
          git archive --prefix=raven/ HEAD | tar -x -C "$RUNNER_TEMP"
          opam pin add -n -y "$RUNNER_TEMP/raven"

      # --with-test tests the named package only. The steps run in dependency
      # order, since a package that an earlier step installed as a dependency
      # would not be tested. A step after a failed one installs the failed
      # package without its tests.
      - name: Build and test lz
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test lz

      - name: Build and test rig
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test rig

      - name: Build and test nx
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test nx

      - name: Build and test tolk
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test tolk

      - name: Build and test brot
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.2' }}
        run: bash .github/memcap.sh opam install -y --with-test brot

      - name: Build and test talon
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test talon

      - name: Build and test rune
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test rune

      - name: Build and test ppx_ptree
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test ppx_ptree

      - name: Build and test kaun
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test kaun

      - name: Build and test vega
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test vega

      - name: Build and test munin
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.4' }}
        run: bash .github/memcap.sh opam install -y --with-test munin

      - name: Build and test jera
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test jera

      - name: Build and test norn
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test norn

      - name: Build and test hugin
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test hugin

      - name: Build and test quill
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.4' }}
        run: bash .github/memcap.sh opam install -y --with-test quill

      # raven installs every package; brot, munin and quill join it here.
      - name: Build and test raven
        if: ${{ !cancelled() && matrix.ocaml-compiler == '5.5' }}
        run: bash .github/memcap.sh opam install -y --with-test raven
