name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2025

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      # The doc and expect tests compare byte-for-byte; a CRLF checkout on
      # Windows would diff every line.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A benchmark run by `dune build` or `dune runtest` can take minutes or
      # exhaust memory: benchmarks run only through @bench.
      - name: Check that benchmarks run only on @bench
        if: runner.os == 'Linux'
        run: python3 scripts/check_bench_rules.py

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      # Strawberry Perl ships a pkg-config shim that shadows Cygwin's pkgconf
      # and breaks the bytesrw build.
      - name: Drop Strawberry Perl's pkg-config shim
        if: runner.os == 'Windows'
        run: rm -f "C:/Strawberry/perl/bin/pkg-config" "C:/Strawberry/perl/bin/pkg-config.bat"

      # opam installs bytesrw's pkgconf through Cygwin's setup, which also
      # upgrades a cached Cygwin and kills every process holding cygwin1.dll:
      # run from the Cygwin bash of the other steps, it kills its own step.
      - name: Install pkgconf outside Cygwin
        if: runner.os == 'Windows'
        shell: pwsh
        run: opam install conf-pkg-config

      - name: Install dependencies
        run: |
          opam pin add thumper git+https://github.com/invariant-hq/thumper.git --no-action
          opam pin add windtrap git+https://github.com/invariant-hq/windtrap.git#7be03df651610949a87ed3bb797984015e9691b9 --no-action
          opam pin add ppx_windtrap git+https://github.com/invariant-hq/windtrap.git#7be03df651610949a87ed3bb797984015e9691b9 --no-action
          opam install . --deps-only --with-test

      - name: Build and test compress
        run: |
          opam exec -- dune build --release otherlibs/compress
          opam exec -- dune build --release @otherlibs/compress/runtest

      # The decoders parse untrusted bytes: their suites run with the C built
      # under AddressSanitizer and UndefinedBehaviorSanitizer, each property
      # over 1000 inputs.
      - name: Test compress under the sanitizers
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          WINDTRAP_PROP_COUNT: 1000
        run: opam exec -- dune build --profile sanitize @otherlibs/compress/runtest

      - name: Build and test nx
        run: |
          opam exec -- dune build --release packages/nx
          opam exec -- dune build --release @packages/nx/runtest

      # Every nx suite runs with the C of nx built under AddressSanitizer and
      # UndefinedBehaviorSanitizer. The codecs parse untrusted bytes, and the
      # bit kernels read and write views at any bit: their properties run
      # first, over 1000 cases each. A domain's thread exits on the signal
      # stack the OCaml runtime allocated, which AddressSanitizer would unmap
      # as its own. The documentation's examples run in the step above: dune
      # 3.24 links mdx's generator without the profile's link flags.
      - name: Test nx under the sanitizers
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:use_sigaltstack=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          WINDTRAP_PROP_COUNT=1000 opam exec -- dune build --profile sanitize @packages/nx/test/io/runtest
          WINDTRAP_PROP_COUNT=1000 opam exec -- dune exec --profile sanitize packages/nx/test/test_bit.exe
          opam exec -- dune build --profile sanitize @packages/nx/test/runtest

      - name: Build and test brot
        env:
          BROT_REQUIRE_FIXTURES: 1
        run: |
          packages/brot/bench/download_data.sh
          python3 packages/brot/test/gen/download_hf_tokenizers.py
          opam exec -- dune build --release packages/brot
          opam exec -- dune build --release @packages/brot/runtest

      - name: Build and test talon
        run: |
          opam exec -- dune build --release packages/talon
          opam exec -- dune build --release @packages/talon/runtest

      # The CSV and Parquet decoders parse untrusted bytes: their suites, the
      # fuzz suites included, run with the C built under AddressSanitizer and
      # UndefinedBehaviorSanitizer, each property over 1000 files.
      - name: Test talon's decoders under the sanitizers
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          WINDTRAP_PROP_COUNT: 1000
        run: opam exec -- dune build --profile sanitize @packages/talon/test/csv/runtest @packages/talon/test/parquet/runtest

      # Talon's benchmark questions at the CI size (H2O at 1e6 rows, TPC-H at
      # scale factor 0.1) must answer as DuckDB's committed answers do. The
      # suite's uv scripts generate the data; one OS suffices, since the
      # answers depend on talon's semantics, which runtest covers per OS.
      - name: Set-up uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6

      - name: Check talon's benchmark answers
        if: runner.os == 'Linux'
        env:
          DATA: ${{ runner.temp }}/talon-bench
        run: |
          (cd packages/talon/bench/queries && uv run h2o_data.py 1e6 "$DATA" && uv run tpch_data.py 0.1 "$DATA")
          opam exec -- dune exec --release packages/talon/bench/queries/runner.exe -- check packages/talon/bench/queries/answers "$DATA"

      - name: Build and test rune
        run: |
          opam exec -- dune build --release packages/rune
          opam exec -- dune build --release @packages/rune/runtest

      - name: Build and test ppx_ptree
        run: |
          opam exec -- dune build --release packages/ppx_ptree
          opam exec -- dune build --release @packages/ppx_ptree/runtest

      - name: Build and test kaun
        run: |
          opam exec -- dune build --release packages/kaun
          opam exec -- dune build --release @packages/kaun/runtest

      - name: Build and test vega
        run: |
          opam exec -- dune build --release packages/vega
          opam exec -- dune build --release @packages/vega/runtest

      - name: Build and test fehu
        run: |
          opam exec -- dune build --release contrib/fehu
          opam exec -- dune build --release @contrib/fehu/runtest

      - name: Build and test sowilo
        run: |
          opam exec -- dune build --release contrib/sowilo
          opam exec -- dune build --release @contrib/sowilo/runtest

      - name: Build and test munin
        run: |
          opam exec -- dune build --release packages/munin
          opam exec -- dune build --release @packages/munin/runtest

      - name: Build and test norn
        run: |
          opam exec -- dune build --release packages/norn
          opam exec -- dune build --release @packages/norn/runtest

      - name: Build and test ymir
        run: |
          opam exec -- dune build --release contrib/ymir
          opam exec -- dune build --release @contrib/ymir/runtest

      - name: Build and test tolk
        run: |
          opam exec -- dune build --release packages/tolk
          opam exec -- dune build --release @packages/tolk/runtest

      - name: Build and test hugin
        run: |
          opam exec -- dune build --release packages/hugin
          opam exec -- dune build --release @packages/hugin/runtest

      - name: Build and test quill
        run: |
          opam exec -- dune build --release packages/quill
          opam exec -- dune build --release @packages/quill/runtest

      # windtrap captures a test's output, so a sanitizer's report, written to
      # standard error as the process aborts, lands in the test's capture
      # under _build/_tests and in no failure block.
      - name: Print the sanitizers' reports
        if: failure() && runner.os != 'Windows'
        run: |
          { grep -rlE 'Sanitizer|runtime error:' _build/_tests || true; } |
            while read -r f; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
