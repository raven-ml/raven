name: tinygrad reference reproduces

on:
  push:
    paths:
      - 'packages/tolk/test/gen/**'
      - 'packages/rune/test/gen/**'
      - 'packages/tolk/test/**/*.golden'
      - 'packages/rune/test/**/*.golden'
      - '.github/workflows/tinygrad-reference.yml'
  pull_request:
    paths:
      - 'packages/tolk/test/gen/**'
      - 'packages/rune/test/gen/**'
      - 'packages/tolk/test/**/*.golden'
      - 'packages/rune/test/**/*.golden'
      - '.github/workflows/tinygrad-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out tinygrad at the pinned commit
        run: |
          pin=$(sed -n 's/^TINYGRAD = "\(.*\)"$/\1/p' packages/tolk/test/gen/generate.py)
          git init -q _tinygrad_next
          git -C _tinygrad_next fetch -q --depth 1 https://github.com/tinygrad/tinygrad "$pin"
          git -C _tinygrad_next checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and compare tolk's goldens
        run: python3 packages/tolk/test/gen/generate.py --check
      - name: Regenerate and compare rune's goldens
        run: python3 packages/rune/test/gen/generate.py --check
