# The environment of mynd's test generators, on the CPU. Run one from this
# directory with `uv run --locked NAME.py ARGS`, its header giving ARGS.
[project]
name = "mynd-test-gen"
version = "0"
requires-python = "==3.13.*"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "pillow==13.0.0",
  "pycocotools==2.0.10",
  "scikit-image==0.26.0",
  "opencv-python-headless==4.12.0.88",
]

[tool.uv]
package = false
# torchvision's CPU wheel for Linux on x86-64 is 0.24.0+cpu; the resolver
# looks for it only where an environment requires it.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
